[advisories]
# Acknowledged transitive vulnerabilities with no upstream fix available.
# These match the ignore list in deny.toml — keep both in sync.
ignore = [
    # rsa 0.9.x Marvin timing attack — transitive via sqlx-mysql; no upstream fix available.
    "RUSTSEC-2023-0071",
    # async-std discontinued — transitive via chromiumoxide (cdp library); no alternative yet.
    "RUSTSEC-2025-0052",
    # fxhash unmaintained — transitive via scraper->selectors; upstream must update.
    "RUSTSEC-2025-0057",
    # quick-xml DoS (quadratic attribute check) — transitive via rust-s3->aws-creds, which
    # pins quick-xml = "0.38"; no newer aws-creds release available yet.
    "RUSTSEC-2026-0194",
    # quick-xml DoS (unbounded namespace allocation) — same transitive path as above.
    "RUSTSEC-2026-0195",
]
